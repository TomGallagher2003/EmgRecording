site_name: EMG/EEG Experiment Program
site_description: Tkinter UI and recording utilities for EMG/EEG exercise sessions
# repo_url: https://github.com/yourname/yourrepo
# repo_name: yourrepo

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
    - toc.integrate

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Structure: dev/structure.md
  - Configuration:
      - Configuration Overview: config/index.md
      - Constants: config/constants.md
      - Images & Assets: config/images.md
  - Key Actions:
      - Device Check: key-actions/device-check.md
      - Start Session: key-actions/start-session.md
      - Pause & Resume: key-actions/pause-resume.md
      - Stop Safely: key-actions/stop-safely.md
      - Recording Lifecycle: key-actions/recording-lifecycle.md
  - API Reference:
      - timer: api/timer.md
      - core.phase_manager: api/core-phase_manager.md
      - core.recording_helpers: api/core-recording_helpers.md
      - core.ui:
          - device_screen: api/core-ui-device_screen.md
          - parameter_screen: api/core-ui-parameter_screen.md
          - main_screen: api/core-ui-main_screen.md
          - image_loader: api/core-ui-image_loader.md
      - util.images: api/util-images.md
      - util.data_validation: api/util-data_validation.md
      - empty_recording: api/empty_recording.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            show_if_no_docstring: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji

watch:
  - core
  - util
  - docs
  - timer.py
